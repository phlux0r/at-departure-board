; Firmware build and native tests.
;
;   pio run -e esp32                build (live data path, classic ESP32)
;   pio run -e esp32_demo           build (demo scenes, no network)
;   pio run -e esp32s3              build (live data path, ESP32-S3 SuperMini)
;   pio run -e esp32s3_demo         build (demo scenes, no network)
;   pio run -e esp32 -t upload      flash: enter download mode by hand FIRST
;                                   (hold BOOT, tap EN, release BOOT)
;   pio run -e esp32s3 -t upload    flash: normally just works; if not, hold
;                                   BOOT while tapping RESET
;   pio device monitor              serial log, 115200
;   pio test -e native              unit tests for lib/core on this PC
[platformio]
default_envs = esp32

[env]
build_unflags = -std=gnu++11
build_flags = -std=gnu++17

; TFT_eSPI settings that do not depend on which MCU or panel controller is in
; use. The driver, colour order and inversion differ per board - see the
; comment above each env - because the panel controller can't be detected in
; software (docs/hardware-notes.md, "The display is an ST7789, not an
; ILI9341") and different sourcing runs have turned out to be genuinely
; different chips. Pins are per-board too, and live in each env below.
[panel]
build_flags =
  -DUSER_SETUP_LOADED=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_GFXFF=1
  -DSPI_FREQUENCY=27000000
  -DSPI_READ_FREQUENCY=6000000

[env:esp32]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
; No monitor_port/upload_port: PlatformIO auto-detects. With more than one
; board attached, pass --upload-port / --monitor-port on the command line.
; Auto-reset into the bootloader does not work on this board, so esptool must
; not try; and the CH340 link drops at 460800. See docs/hardware-notes.md.
upload_speed = 115200
board_upload.before_reset = no_reset
lib_deps =
  bodmer/TFT_eSPI@2.5.43
  bblanchon/ArduinoJson@7.4.3
test_ignore = *
build_flags =
  ${env.build_flags}
  ${panel.build_flags}
  -DCORE_DEBUG_LEVEL=0
  ; This unit's panel is an ST7789 sold as an ILI9341 - see
  ; docs/hardware-notes.md, "The display is an ST7789, not an ILI9341". If a
  ; differently-sourced panel shows wrong colours or geometry, the symptom
  ; table there says which of these three to change.
  -DST7789_DRIVER=1
  -DTFT_RGB_ORDER=TFT_BGR
  -DTFT_INVERSION_OFF=1
  -DTFT_MISO=19
  -DTFT_MOSI=23
  -DTFT_SCLK=18
  -DTFT_CS=15
  -DTFT_DC=2
  -DTFT_RST=4
  -DBACKLIGHT_PIN=32

[env:esp32_demo]
extends = env:esp32
build_flags = ${env:esp32.build_flags} -DDEMO_MODE=1

; ESP32-S3 SuperMini (ESP32-S3FH4R2: 4 MB in-package flash, 2 MB quad PSRAM).
;
; There is no stock board definition for the N4R2 part, so esp32-s3-devkitc-1
; is used and the flash size corrected below - the stock board is an 8 MB,
; no-PSRAM N8 and its default_8MB.csv partition table would not even fit.
;
; The pin map avoids the strapping pins (0, 3, 45, 46), the native-USB pins
; (19, 20) and GPIO26-32, which are wired to the in-package flash and PSRAM.
; See docs/hardware-notes.md, "ESP32-S3 SuperMini".
[env:esp32s3]
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; None of the classic board's upload workarounds apply here: the S3 talks to
; the host over native USB, not a CH340, so auto-reset and the default upload
; speed both work.
;
; 4 MB flash, not the 8 MB the stock board definition claims.
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
; The live build does not fit the default app partition - docs/hardware-notes.md,
; "Flash is the tighter constraint". OTA is a non-goal, so one big app
; partition (3 MB app + 1 MB SPIFFS) is the right shape.
board_build.partitions = huge_app.csv
; <flash mode>_<psram type>. The FH4R2 has quad SPI flash and quad PSRAM, so
; qio_qspi; getting this wrong links against the wrong prebuilt SDK and the
; board either boots without PSRAM or crashes on the first allocation.
board_build.arduino.memory_type = qio_qspi
lib_deps =
  bodmer/TFT_eSPI@2.5.43
  bblanchon/ArduinoJson@7.4.3
test_ignore = *
build_flags =
  ${env.build_flags}
  ${panel.build_flags}
  -DCORE_DEBUG_LEVEL=0
  ; This unit's panel is a genuine ILI9341 - confirmed on hardware, 2026-09-21
  ; (colours and geometry correct with no further RGB/inversion changes
  ; needed). A different sourcing run could still turn out otherwise; see
  ; docs/hardware-notes.md, "The display is an ST7789, not an ILI9341".
  -DILI9341_DRIVER=1
  -DTFT_RGB_ORDER=TFT_BGR
  -DTFT_INVERSION_OFF=1
  ; Display and touch share SCK/MOSI/MISO; touch has its own CS (see below).
  -DTFT_MISO=13
  -DTFT_MOSI=11
  -DTFT_SCLK=12
  -DTFT_CS=10
  -DTFT_DC=9
  -DTFT_RST=8
  -DBACKLIGHT_PIN=7
  ; XPT2046 touch, on the same SPI bus as the display (T_CLK/T_DIN/T_DO are
  ; the SCK/MOSI/MISO wires above). T_IRQ (GPIO5) is wired but unused -
  ; TFT_eSPI's touch support polls, which is enough at 15 fps (src/touch.cpp).
  ; No touch UI reads this yet; it's calibration plus raw reads only.
  -DTOUCH_CS=6
  -DSPI_TOUCH_FREQUENCY=2500000
  ;
  ; Without this, TFT_eSPI's ESP32-S3 driver defaults to a *reference* to the
  ; Arduino core's global SPI object (SPIClass& spi = SPI;) rather than
  ; constructing its own. Whether that reference is safe to use depends on
  ; C++ static-initialization order across separately-compiled files, and on
  ; this core version it is not: the board panics (Guru Meditation,
  ; StoreProhibited) the instant TFT_eSPI's first SPI transaction runs, in
  ; begin_tft_write(), even though the build succeeds. Documented for this
  ; exact combination in Bodmer/TFT_eSPI#3329 and espressif/arduino-esp32#9618.
  ; This flag makes TFT_eSPI construct its own SPIClass instead, which
  ; sidesteps the ordering problem.
  -DUSE_HSPI_PORT
  ;
  ; Without this the USB CDC port stays silent and every Serial.printf in the
  ; boot log - including the portal's IP - is lost. ARDUINO_USB_MODE=1 already
  ; comes from the board definition.
  -DARDUINO_USB_CDC_ON_BOOT=1
  ; The 2 MB of PSRAM is headroom, not yet used by the renderer: the bands in
  ; src/ui.h stay in internal RAM, which is faster.
  -DBOARD_HAS_PSRAM

[env:esp32s3_demo]
extends = env:esp32s3
build_flags = ${env:esp32s3.build_flags} -DDEMO_MODE=1

[env:native]
platform = native
test_build_src = no
lib_deps = bblanchon/ArduinoJson@7.4.3
build_flags = ${env.build_flags} -Wall -Wextra
